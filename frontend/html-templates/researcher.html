<!DOCTYPE html>
<html class="light" lang="en">
<head>

  <link href="https://fonts.googleapis.com" rel="preconnect"/>
  <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
  <link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:ital,wght@0,300..900;1,300..900&amp;family=Source+Serif+4:ital,opsz,wght@0,8..60,300..900;1,8..60,300..900&amp;display=swap" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet"/>
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <script id="tailwind-config">
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            "surface": "#f8fafc",
            "on-surface": "#0f172a",
            "on-surface-variant": "#475569",
            "primary": "#0b1c30",
            "on-primary": "#ffffff",
            "secondary": "#0284c7",
            "secondary-container": "#bae6fd",
            "tertiary": "#059669",
            "outline": "#94a3b8",
            "outline-variant": "#e2e8f0"
          },
          fontFamily: {
            "sans": ["'Hanken Grotesk'", "sans-serif"],
            "serif": ["'Source Serif 4'", "serif"]
          }
        }
      }
    }
  </script>
  <style>
    .material-symbols-outlined {
      font-family: 'Material Symbols Outlined', sans-serif;
      font-size: 20px;
      line-height: 1;
      display: inline-block;
      white-space: nowrap;
      -webkit-font-smoothing: antialiased;
    }
  </style>

<body class="bg-surface text-on-surface min-h-screen flex flex-col font-sans antialiased">
  <header class="bg-white/90 backdrop-blur-md border-b border-outline-variant sticky top-0 z-40">
    <div class="max-w-7xl mx-auto px-6 h-16 flex items-center justify-between">
      <div class="flex items-center gap-4">
        <a href="/" class="flex items-center gap-2">
          <div class="w-8 h-8 rounded-lg bg-primary text-white flex items-center justify-center font-serif font-bold text-sm">VR</div>
          <span class="font-serif font-bold text-base text-primary">Researcher Workspace</span>
        </a>
        <span class="text-xs px-2.5 py-1 rounded-full bg-secondary-container text-on-secondary-container font-semibold">Active: Dr. Nguyen Van An</span>
      </div>
      <div class="flex items-center gap-3">
        <a href="./workspace-shell.html" class="text-xs font-semibold text-secondary hover:underline">Switch Context</a>
      </div>
    </div>
  </header>

  <main class="max-w-7xl mx-auto px-6 py-10 flex-grow w-full space-y-8">
    <!-- Milestone Tracker Banner -->
    <div class="bg-white rounded-2xl border border-outline-variant p-6 shadow-xs">
      <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 mb-4">
        <div>
          <span class="text-xs font-bold text-emerald-700 uppercase tracking-wider">Active Joint Project • Milestone 2 of 4</span>

        <button class="px-4 py-2 rounded-xl bg-primary text-white text-xs font-semibold hover:bg-primary/90">
          Upload Milestone Deliverables
        </button>
      </div>
      <div class="w-full bg-surface-container h-2.5 rounded-full overflow-hidden">
        <div class="bg-secondary h-full rounded-full w-[60%]"></div>
      </div>
      <div class="flex justify-between text-xs text-on-surface-variant mt-2">
        <span>Milestone 1: Synthesis Complete (Approved)</span>
        <span class="font-semibold text-secondary">Milestone 2: Tropical Aging Test (Due Oct 30)</span>
        <span>Milestone 3: Field Deployment</span>
      </div>
    </div>
