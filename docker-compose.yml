name: vnru-network

networks:
  vnru-net:

volumes:
  postgres_data:

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: auth_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-55432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d auth_db"]
      interval: 3s
      timeout: 3s
      retries: 20
    networks: [vnru-net]

  migrate:
    build:
      context: ./services/auth-service
      target: tools
    restart: "no"
    command: pnpm exec prisma migrate deploy --config prisma.config.ts
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/auth_db?schema=public
    depends_on:
      postgres:
        condition: service_healthy
    networks: [vnru-net]

  demo-seed:
    build:
      context: ./services/auth-service
      target: tools
    restart: "no"
    profiles: [seed]
    command: pnpm exec ts-node prisma/seed-demo.ts /run/secrets/account.json
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/auth_db?schema=public
    volumes:
      - ./secrets/account.json:/run/secrets/account.json:ro
    depends_on:
      migrate:
        condition: service_completed_successfully
    networks: [vnru-net]

  auth-service:
    build: ./services/auth-service
    restart: unless-stopped
    environment:
      NODE_ENV: development
      PORT: 3000
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/auth_db?schema=public
      AUTH_BRIDGE_SECRET: ${AUTH_BRIDGE_SECRET:?set in secrets/demo.env}
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME:?set in secrets/demo.env}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY:?set in secrets/demo.env}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET:?set in secrets/demo.env}
    depends_on:
      migrate:
        condition: service_completed_successfully
    networks: [vnru-net]

  frontend:
    build: ./frontend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      AUTH_SERVICE_URL: http://auth-service:3000
      NEXTAUTH_URL: ${FRONTEND_URL:-http://localhost:8082}
      NEXTAUTH_SECRET: ${AUTH_SECRET:?set in secrets/demo.env}
      AUTH_SECRET: ${AUTH_SECRET:?set in secrets/demo.env}
      AUTH_BRIDGE_SECRET: ${AUTH_BRIDGE_SECRET:?set in secrets/demo.env}
      ACCOUNT_CONFIG_PATH: /run/secrets/account.json
    volumes:
      - ./secrets/account.json:/run/secrets/account.json:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      auth-service:
        condition: service_started
    networks: [vnru-net]

  nginx:
    build: ./infra/nginx
    restart: unless-stopped
    ports:
      - "${NGINX_HTTP_PORT:-8082}:80"

    depends_on:
      - frontend
      - auth-service
    networks: [vnru-net]
