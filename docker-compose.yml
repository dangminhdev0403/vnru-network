name: vnru-network

networks:
  vnru-net:

volumes:
  postgres_data:
  keycloak_data:

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: auth_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-55432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d auth_db"]
      interval: 3s
      timeout: 3s
      retries: 20
    networks: [vnru-net]

  keycloak:
    build: ./infra/keycloak
    restart: unless-stopped
    command: start-dev
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?set in secrets/demo.env}
      KC_HOSTNAME: ${KEYCLOAK_PUBLIC_URL:-http://host.docker.internal:8180}
      KC_HEALTH_ENABLED: "true"
    volumes:
      - keycloak_data:/opt/keycloak/data
    ports:
      - "${KEYCLOAK_PORT:-8180}:8080"
    networks: [vnru-net]

  migrate:
    build:
      context: ./services/auth-service
      target: tools
    restart: "no"
    command: pnpm exec prisma migrate deploy --config prisma.config.ts
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/auth_db?schema=public
    depends_on:
      postgres:
        condition: service_healthy
    networks: [vnru-net]

  demo-seed:
    build:
      context: ./services/auth-service
      target: tools
    restart: "no"
    profiles: [seed]
    command: pnpm exec ts-node prisma/seed-demo.ts /dev/stdin
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/auth_db?schema=public
      KEYCLOAK_ADMIN_URL: http://keycloak:8080
      KEYCLOAK_PUBLIC_URL: ${KEYCLOAK_PUBLIC_URL:-http://host.docker.internal:8180}
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?set in secrets/demo.env}
      KEYCLOAK_CLIENT_SECRET: ${KEYCLOAK_CLIENT_SECRET:?set in secrets/demo.env}
      KEYCLOAK_PROFILE_CLIENT_SECRET: ${KEYCLOAK_PROFILE_CLIENT_SECRET:?set in secrets/demo.env}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:8082}
    depends_on:
      migrate:
        condition: service_completed_successfully
      keycloak:
        condition: service_started
    networks: [vnru-net]

  auth-service:
    build: ./services/auth-service
    restart: unless-stopped
    environment:
      NODE_ENV: development
      PORT: 3000
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/auth_db?schema=public
      KEYCLOAK_ISSUER_URL: ${KEYCLOAK_PUBLIC_URL:-http://host.docker.internal:8180}/realms/vnru
      KEYCLOAK_CLIENT_ID: vnru-auth
      KEYCLOAK_REDIRECT_URI: ${FRONTEND_URL:-http://localhost:8082}/api/auth/callback/keycloak
      KEYCLOAK_PROFILE_CLIENT_ID: vnru-profile-service
      KEYCLOAK_PROFILE_CLIENT_SECRET: ${KEYCLOAK_PROFILE_CLIENT_SECRET:?set in secrets/demo.env}
    depends_on:
      migrate:
        condition: service_completed_successfully
    networks: [vnru-net]

  frontend:
    build: ./frontend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      AUTH_SERVICE_URL: http://auth-service:3000
      NEXTAUTH_URL: ${FRONTEND_URL:-http://localhost:8082}
      NEXTAUTH_SECRET: ${AUTH_SECRET:?set in secrets/demo.env}
      AUTH_SECRET: ${AUTH_SECRET:?set in secrets/demo.env}
      AUTH_KEYCLOAK_ID: vnru-auth
      AUTH_KEYCLOAK_SECRET: ${KEYCLOAK_CLIENT_SECRET:?set in secrets/demo.env}
      AUTH_KEYCLOAK_ISSUER: ${KEYCLOAK_PUBLIC_URL:-http://host.docker.internal:8180}/realms/vnru
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      auth-service:
        condition: service_started
    networks: [vnru-net]

  nginx:
    build: ./infra/nginx
    restart: unless-stopped
    ports:
      - "${NGINX_HTTP_PORT:-8082}:80"

    depends_on:
      - frontend
      - auth-service
      - keycloak
    networks: [vnru-net]