server {
    listen 80;
    listen [::]:80;
    server_name localhost _;

    # Docker DNS is re-resolved after app container recreation.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $frontend_upstream http://frontend:3000;
    set $auth_service_upstream http://auth-service:3000;

    # Common Proxy Headers
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Port $server_port;

    # Timeouts
    proxy_connect_timeout 60s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;

    # 1. Direct Backend Microservices API Endpoints
    # Module 1: Auth & IAM Admin
    location /api/v1/auth/ {
        proxy_pass $auth_service_upstream;
    }

    location /api/v1/admin/ {
        proxy_pass $auth_service_upstream;
    }

    # 2. Next.js Static Asset Optimization
    location /_next/static/ {
        proxy_pass $frontend_upstream;
        proxy_cache_bypass $http_upgrade;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # 3. Next.js Frontend Portal (Default Route & SSR / BFF APIs)
    location / {
        proxy_pass $frontend_upstream;
        proxy_buffer_size 128k;
        proxy_buffers 4 256k;
        proxy_busy_buffers_size 256k;
    }
}
